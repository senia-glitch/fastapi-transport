[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastbase"
version = "0.1.0"
description = "Thin infrastructure over FastAPI for a uniform transport (API) layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fastbase" }]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "httpx2",
]

[project.scripts]
fastapi-transport = "fastbase.cli.__main__:main"
fastbase = "fastbase.cli.__main__:main"
fb = "fastbase.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["fastbase*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"fastbase.cli" = ["templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
source = ["fastbase"]
omit = ["fastbase/cli/templates/*"]

[tool.coverage.report]
show_missing = true